<!DOCTYPE html>
<html>
<head>
    <title>E-Learning Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="loginPage">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Masukkan nama">
    <br><br>
    <button onclick="login()">Masuk</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

    <h1>E-Learning Sederhana</h1>

    <h3>Selamat datang, <span id="namaUser"></span></h3>

    <!-- MATERI -->
    <div class="card">
        <h2>Materi</h2>
        <ul>
            <li>Pengenalan HTML</li>
            <li>Pengenalan CSS</li>
        </ul>
    </div>

    <!-- KUIS -->
    <div class="card">
        <h2>Kuis</h2>

        <p id="soal"></p>

        <button onclick="jawab(0)" id="opsi0"></button><br><br>
        <button onclick="jawab(1)" id="opsi1"></button><br><br>
        <button onclick="jawab(2)" id="opsi2"></button>

        <p id="feedback"></p>
    </div>

    <!-- PROGRESS -->
    <div class="card">
        <h2>Progress</h2>
        <p id="progress">0%</p>

        <div class="progress-bar">
            <div id="bar"></div>
        </div>

        <p>Skor: <span id="skor">0</span></p>

        <button onclick="resetData()">Reset Progress</button>
    </div>

</div>

<script>
// LOGIN
function login(){
    let user = document.getElementById("username").value;

    if(user === ""){
        alert("Masukkan nama dulu!");
        return;
    }

    localStorage.setItem("user", user);

    document.getElementById("loginPage").style.display = "none";
    document.getElementById("app").style.display = "block";

    document.getElementById("namaUser").innerText = user;
}

// LOAD USER
window.onload = function(){
    let user = localStorage.getItem("user");

    if(user){
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("app").style.display = "block";
        document.getElementById("namaUser").innerText = user;
    }

    tampilSoal();
}

// DATA KUIS
const kuis = [
    {
        soal: "Apa kepanjangan HTML?",
        opsi: ["HyperText Markup Language", "Home Tool Markup Language", "Hyperlinks Text"],
        jawaban: 0
    },
    {
        soal: "CSS digunakan untuk?",
        opsi: ["Struktur", "Style/Tampilan", "Database"],
        jawaban: 1
    }
];

let index = 0;
let skor = 0;

// TAMPIL SOAL
function tampilSoal(){
    if(index < kuis.length){
        document.getElementById("soal").innerText = kuis[index].soal;
        document.getElementById("opsi0").innerText = kuis[index].opsi[0];
        document.getElementById("opsi1").innerText = kuis[index].opsi[1];
        document.getElementById("opsi2").innerText = kuis[index].opsi[2];
    }
}

// JAWAB
function jawab(pilihan){
    if(pilihan === kuis[index].jawaban){
        skor += 50;
        document.getElementById("feedback").innerText = "Benar!";
    } else {
        document.getElementById("feedback").innerText = "Salah!";
    }

    index++;

    let persen = (index / kuis.length) * 100;

    document.getElementById("bar").style.width = persen + "%";
    document.getElementById("progress").innerText = Math.round(persen) + "%";
    document.getElementById("skor").innerText = skor;

    localStorage.setItem("skor", skor);
    localStorage.setItem("progress", persen);

    if(index < kuis.length){
        tampilSoal();
    } else {
        document.getElementById("soal").innerText = "Kuis selesai!";
    }
}

// RESET
function resetData(){
    localStorage.clear();
    location.reload();
}
</script>

</body>
</html>
